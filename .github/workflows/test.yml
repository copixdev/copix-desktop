name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [macOS/studio, Windows/studio, shared/theme]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install and test
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          npm test

# Builds Copix Desktop v4.4.0 installers and attaches them to the GitHub Release
# "v4.4.0 — logo renewal". Dispatch this by hand from main after the source
# lands. It does not run on push, so opening a pull request does not publish.
name: Desktop v4.4.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64 dmg
            project: macOS/studio
            script: dist:release
            artifact_name: macos-dmg
            artifact_path: macOS/studio/release/staging/Copix-4.4.0-macOS-arm64.dmg
          - os: windows-latest
            label: Windows x64 exe
            project: Windows/studio
            script: dist
            artifact_name: windows-exe
            artifact_path: Windows/studio/release/staging/Copix-4.4.0-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render icons and package
        working-directory: ${{ matrix.project }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          python -m pip install pillow
          npm ci
          npm run icons
          npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Attach v4.4.0 release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publish
          find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} publish/ \;
          (
            cd publish
            sha256sum Copix-4.4.0-macOS-arm64.dmg Copix-4.4.0-Windows-x64.exe > SHA256SUMS.txt
          )
          cat publish/SHA256SUMS.txt
          if gh release view v4.4.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload v4.4.0 publish/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit v4.4.0 --repo "${GITHUB_REPOSITORY}" --title "v4.4.0 — logo renewal" --notes-file .github/desktop-v4.4.0-release-notes.md
          else
            gh release create v4.4.0 publish/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v4.4.0 — logo renewal" \
              --notes-file .github/desktop-v4.4.0-release-notes.md \
              --target "${GITHUB_SHA}"
          fi
